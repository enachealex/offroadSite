name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The build only needs the committed image derivatives under
          # public/, so skip the full-resolution masters in photos/ rather
          # than pulling a few hundred megabytes on every deploy.
          filter: blob:none
          sparse-checkout: |
            /*
            !/offroad-react/photos
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: offroad-react/package-lock.json

      - name: Install dependencies
        working-directory: offroad-react
        run: npm ci

      - name: Build
        working-directory: offroad-react
        run: npm run build

      - name: Copy CNAME into dist
        run: |
          if [ -f CNAME ]; then
            cp CNAME offroad-react/dist/CNAME
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: offroad-react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
